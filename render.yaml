services:
  - type: web
    name: math-homework-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_APP
        value: app.py
      # OPENAI_API_KEY：请在 Render 控制台 Environment 中配置（作业 GPT 判题）
      # 可选：OPENAI_MODEL=gpt-4o-mini  AI_GRADING_ENABLED=true
      - key: PYTHON_VERSION
        value: 3.10.0
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: math_db
    plan: free
    ipAllowList: []

