services:
  - type: web
    name: math-homework-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_APP
        value: app.py
      # OPENAI_API_KEY：请在 Render 控制台 Environment 中配置（作业 GPT 判题）
      # 可选：OPENAI_MODEL=gpt-4o-mini  AI_GRADING_ENABLED=true
      # 邮件提醒：RESEND_API_KEY 或 MAIL_SERVER/MAIL_USERNAME/MAIL_PASSWORD
      # CRON_SECRET：定时任务鉴权；HOMEWORK_REMINDER_TZ 默认 America/Vancouver
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: HOMEWORK_REMINDER_TZ
        value: America/Vancouver
    healthCheckPath: /
    autoDeploy: true

  # 每小时检查一次；仅在本地时区周五 17:00-17:59 真正发信
  - type: cron
    name: weekly-homework-reminder
    env: python
    runtime: python
    plan: starter
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/send_homework_reminders.py
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: HOMEWORK_REMINDER_TZ
        value: America/Vancouver
      # 需在 Render 控制台同步配置 DATABASE_URL / RESEND_API_KEY 等

databases:
  - name: math_db
    plan: free
    ipAllowList: []
