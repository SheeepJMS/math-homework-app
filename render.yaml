services:
  - type: web
    name: math-homework-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_APP
        value: app.py
      # OPENAI_API_KEY ?? Render ??? ? Environment ???????????
      - key: PYTHON_VERSION
        value: 3.10.0
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: math_db
    plan: free
    ipAllowList: []

