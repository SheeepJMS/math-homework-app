{% extends "diagnostic/base.html" %}
{% block title %}试卷中心 - 诊断系统{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='diagnostic/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='diagnostic/exam_tree.css') }}">
{% endblock %}
{% block content %}
<div class="dashboard-page">
  <h2 class="mb-4"><i data-lucide="pencil" class="me-2"></i>试卷中心</h2>
  <p class="text-muted small mb-4">按学科 → 竞赛大类 → 具体竞赛 → 年份 四级结构浏览，支持搜索过滤。</p>

  {% include 'diagnostic/_exam_tree.html' %}
</div>
{% endblock %}
{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var search = document.getElementById('examTreeSearch');
    function applyFilter(q) {
      if (!search) return;
      q = (q || '').toLowerCase().trim();
      document.querySelectorAll('.tree-year-row').forEach(function (row) {
        var title = (row.getAttribute('data-title') || '').toLowerCase();
        var sub = (row.getAttribute('data-subject') || '').toLowerCase();
        var cat = (row.getAttribute('data-category') || '').toLowerCase();
        var cont = (row.getAttribute('data-contest') || '').toLowerCase();
        var yr = (row.getAttribute('data-year') || '').toString();
        var match = !q || title.indexOf(q) >= 0 || sub.indexOf(q) >= 0 || cat.indexOf(q) >= 0 || cont.indexOf(q) >= 0 || yr.indexOf(q) >= 0;
        row.style.display = match ? '' : 'none';
      });
      function hasVisibleDescendant(el) {
        var rows = el.querySelectorAll('.tree-year-row');
        for (var i = 0; i < rows.length; i++) { if (rows[i].style.display !== 'none') return true; }
        var children = el.querySelectorAll(':scope > .tree-children > .tree-node');
        for (var j = 0; j < children.length; j++) { if (hasVisibleDescendant(children[j])) return true; }
        return false;
      }
      document.querySelectorAll('.tree-level-3, .tree-level-2, .tree-level-1').forEach(function (node) {
        node.style.display = hasVisibleDescendant(node) ? '' : 'none';
      });
    }
    if (search) {
      var params = new URLSearchParams(window.location.search);
      var q = params.get('q');
      if (q) {
        search.value = q;
        applyFilter(q);
        document.querySelectorAll('.tree-level-1, .tree-level-2, .tree-level-3').forEach(function (n) { n.classList.remove('collapsed'); });
      }
      search.addEventListener('input', function () { applyFilter(this.value); });
    }
    var firstSub = document.querySelector('.tree-level-1');
    if (firstSub) {
      firstSub.classList.remove('collapsed');
      var firstCat = firstSub.querySelector('.tree-level-2');
      if (firstCat) firstCat.classList.remove('collapsed');
    }
  });
</script>
{% endblock %}
