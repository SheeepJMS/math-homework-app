{% extends "diagnostic/base.html" %}
{% block title %}诊断系统 - 注册{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">注册</h5></div>
            <div class="card-body">
                <form method="post" action="{{ url_for('diagnostic.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认密码</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">注册</button>
                    <a href="{{ url_for('diagnostic.login') }}" class="btn btn-link">已有账号？登录</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
